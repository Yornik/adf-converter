<text x="20.00px" y="51.80px" xml:space="preserve"><tspan xml:space="preserve">Convert Markdown to Atlassian Document Format (ADF) JSON for Jira and Confluence, and back</tspan></text><text x="20.00px" y="68.60px" xml:space="preserve"/><text x="20.00px" y="85.40px" xml:space="preserve"><tspan xml:space="preserve"/><tspan xml:space="preserve" text-decoration="underline">Usage:</tspan><tspan xml:space="preserve"> </tspan><tspan xml:space="preserve"/><tspan xml:space="preserve" fill="#31BB71">adf</tspan><tspan xml:space="preserve"> </tspan><tspan xml:space="preserve" fill="#04D7D7">[OPTIONS]</tspan><tspan xml:space="preserve"> </tspan><tspan xml:space="preserve" fill="#04D7D7">&lt;COMMAND&gt;</tspan><tspan xml:space="preserve"/></text><text x="20.00px" y="102.20px" xml:space="preserve"/><text x="20.00px" y="119.00px" xml:space="preserve"><tspan xml:space="preserve"/><tspan xml:space="preserve" text-decoration="underline">Commands:</tspan><tspan xml:space="preserve"/></text><text x="20.00px" y="135.80px" xml:space="preserve"><tspan xml:space="preserve">  </tspan><tspan xml:space="preserve"/><tspan xml:space="preserve" fill="#31BB71">convert</tspan><tspan xml:space="preserve">       Convert Markdown or CSV to ADF JSON, or ADF JSON to Markdown or CSV</tspan></text><text x="20.00px" y="152.60px" xml:space="preserve"><tspan xml:space="preserve">  </tspan><tspan xml:space="preserve"/><tspan xml:space="preserve" fill="#31BB71">validate</tspan><tspan xml:space="preserve">      Check ADF (or a Markdown or CSV conversion) without writing output</tspan></text><text x="20.00px" y="169.40px" xml:space="preserve"><tspan xml:space="preserve">  </tspan><tspan xml:space="preserve"/><tspan xml:space="preserve" fill="#31BB71">capabilities</tspan><tspan xml:space="preserve">  Describe what this build supports</tspan></text><text x="20.00px" y="186.20px" xml:space="preserve"><tspan xml:space="preserve">  </tspan><tspan xml:space="preserve"/><tspan xml:space="preserve" fill="#31BB71">examples</tspan><tspan xml:space="preserve">      Show Markdown and CSV → ADF examples, one per feature</tspan></text><text x="20.00px" y="203.00px" xml:space="preserve"><tspan xml:space="preserve">  </tspan><tspan xml:space="preserve"/><tspan xml:space="preserve" fill="#31BB71">schema</tspan><tspan xml:space="preserve">        Print a JSON Schema</tspan></text><text x="20.00px" y="219.80px" xml:space="preserve"><tspan xml:space="preserve">  </tspan><tspan xml:space="preserve"/><tspan xml:space="preserve" fill="#31BB71">explain</tspan><tspan xml:space="preserve">       Explain a topic or a diagnostic code</tspan></text><text x="20.00px" y="236.60px" xml:space="preserve"><tspan xml:space="preserve">  </tspan><tspan xml:space="preserve"/><tspan xml:space="preserve" fill="#31BB71">completions</tspan><tspan xml:space="preserve">   Print a shell completion script</tspan></text><text x="20.00px" y="253.40px" xml:space="preserve"><tspan xml:space="preserve">  </tspan><tspan xml:space="preserve"/><tspan xml:space="preserve" fill="#31BB71">version</tspan><tspan xml:space="preserve">       Print version information</tspan></text><text x="20.00px" y="270.20px" xml:space="preserve"><tspan xml:space="preserve">  </tspan><tspan xml:space="preserve"/><tspan xml:space="preserve" fill="#31BB71">help</tspan><tspan xml:space="preserve">          Print this message or the help of the given subcommand(s)</tspan></text>
</g>
