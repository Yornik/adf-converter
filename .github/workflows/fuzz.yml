# Weekly fuzzing of every cargo-fuzz target in fuzz/fuzz_targets (10 minutes each). A crash,
# leak or per-input timeout fails the run and uploads the reproducer from fuzz/artifacts/.
# Reproduce locally with: cargo +nightly fuzz run <target> <artifact file>
name: Fuzz

on:
  schedule:
    - cron: "41 3 * * 6"
  workflow_dispatch:

permissions: {}

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  targets:
    name: list targets
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: list
        run: |
          targets=$(find fuzz/fuzz_targets -maxdepth 1 -type f -name '*.rs' -exec basename {} .rs \; | LC_ALL=C sort)
          if [[ -z $targets ]]; then
            echo "::error::no fuzz targets found in fuzz/fuzz_targets"
            exit 1
          fi
          if grep -v -E '^[A-Za-z0-9_-]+$' <<<"$targets"; then
            echo "::error::unexpected characters in a fuzz target name"
            exit 1
          fi
          echo "targets=$(jq -R . <<<"$targets" | jq -s -c .)" >>"$GITHUB_OUTPUT"

  fuzz:
    name: fuzz (${{ matrix.target }})
    needs: targets
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.targets) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      FUZZ_TARGET: ${{ matrix.target }}
      FUZZ_SECONDS: "600"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # cargo-fuzz needs nightly (sanitizers); `+nightly` overrides rust-toolchain.toml.
      - name: Install the nightly toolchain
        run: rustup toolchain install nightly --profile minimal
      - name: Install cargo-fuzz
        run: cargo +nightly install --locked cargo-fuzz@0.13.2
      - name: Fuzz for ${{ env.FUZZ_SECONDS }} seconds
        run: cargo +nightly fuzz run "$FUZZ_TARGET" -- -max_total_time="$FUZZ_SECONDS" -timeout=60
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
          retention-days: 30
