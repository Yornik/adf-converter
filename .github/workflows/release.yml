# Release pipeline: release-please, build and publish in ONE workflow, because tags and releases
# created with GITHUB_TOKEN do not trigger other workflows.
#
# On every push to main:
#   1. release-please opens or updates the release PR ("chore(main): release X.Y.Z", with the
#      Cargo.toml/Cargo.lock bump and CHANGELOG.md). Once that PR is merged, the next run creates
#      the tag vX.Y.Z (force-tag-creation) and a DRAFT GitHub release.
#   2. build: six targets, each on a native runner. Checks out the release commit, guards
#      tag == Cargo.toml version, builds, smoke-tests and packages with scripts/package.sh.
#      A push that creates no release runs the same build as a dry run of the pushed commit, so
#      a target, smoke-test or packaging failure shows up on `main` while the release PR is
#      still open, before any tag or draft release exists.
#   3. publish (new releases only): checks that there is exactly one zip per target, then
#      SHA256SUMS, build-provenance attestation, asset upload, and the draft is published.
#      Assets go up while the release is still a draft, so this also works with immutable
#      releases enabled. If any build fails, nothing is published and the draft stays.
#
# Dry runs (build only; zips are uploaded as workflow artifacts, never to a release): pushes to
# main that create no release, manual workflow_dispatch, and pull requests that touch the
# release plumbing (paths below).
#
# Token: release-please uses secrets.RELEASE_PLEASE_TOKEN if it is set (a fine-grained PAT or a
# GitHub App token with contents: write and pull-requests: write on this repository), else the
# built-in GITHUB_TOKEN. With GITHUB_TOKEN:
#   - release PRs do not trigger CI (GitHub suppresses workflow runs for events caused by
#     GITHUB_TOKEN), so the required `ci-ok` check never reports on them: merge them with an
#     admin bypass, or set RELEASE_PLEASE_TOKEN;
#   - "Allow GitHub Actions to create and approve pull requests" (Settings > Actions > General)
#     must be enabled, otherwise release-please cannot open the release PR at all.
# No other secrets are used.
name: Release

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/package.sh
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - release-please-config.json
  workflow_dispatch:

permissions: {}

concurrency:
  # Pushes to main share one group, and a running push is never cancelled: it may be in the
  # middle of creating or publishing a release. GitHub keeps only the newest *pending* run of a
  # group and cancels older pending ones; for pushes that is harmless, because release-please is
  # stateless and the newest push still finds every merged release PR. Pull requests and manual
  # runs get groups of their own, so a dry run can never cancel a pending push.
  group: release-${{ github.event_name == 'push' && github.ref || github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('dispatch-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  release-please:
    name: release-please
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    # Labels and comments on the release PR are covered by pull-requests: write; issues: write
    # is not needed.
    permissions:
      contents: write # push the release PR branch, create the tag and the draft release
      pull-requests: write # open/update the release PR and its labels
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # Not in an environment on purpose: this job runs on every push to main, and an
          # environment approval would gate each one. The job only runs on main (never on PRs),
          # and the optional token needs no more than contents + pull-requests write.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }} # zizmor: ignore[secrets-outside-env]
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    name: build (${{ matrix.target }})
    needs: release-please
    # Runs on every push to main (for the new release, or as a dry run when there is none), and
    # as a dry run on pull_request / workflow_dispatch, where the release-please job is skipped.
    if: >-
      !cancelled() &&
      (needs.release-please.result == 'success' || needs.release-please.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        # publish requires exactly one archive per target: keep its list in sync.
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-26-intel
          - target: aarch64-apple-darwin
            os: macos-26
          - target: x86_64-pc-windows-msvc
            os: windows-2025
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      # Empty on dry runs.
      TAG: ${{ needs.release-please.outputs.tag_name }}
      # Link the MSVC C runtime statically, so adf.exe runs without the VC++ redistributable.
      # (Target-specific: has no effect on the other targets.)
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
      CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
    # No rust-cache here, on purpose: a poisoned cache must never reach a release binary.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The commit release-please tagged; empty (the event's commit) on dry runs.
          ref: ${{ needs.release-please.outputs.sha }}

      - name: Install musl-tools
        if: contains(matrix.target, '-linux-musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      - name: Install the toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install
          rustup target add "$TARGET"

      - name: Guard tag == Cargo.toml version
        if: env.TAG != ''
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "adf-converter") | .version')
          if [[ $TAG != "v$version" ]]; then
            echo "::error::release tag $TAG does not match the Cargo.toml version v$version"
            exit 1
          fi

      - name: Build
        run: |
          # Compile-time only: `adf version --json` reports it as "commit".
          ADF_BUILD_COMMIT=$(git rev-parse HEAD)
          export ADF_BUILD_COMMIT
          cargo build --locked --release --target "$TARGET"

      # Every target is built on a runner of its own OS and architecture, so the binary can run.
      - name: Smoke test
        run: |
          exe="target/$TARGET/release/adf"
          if [[ $TARGET == *windows* ]]; then exe="$exe.exe"; fi
          "$exe" --version
          printf '# Release smoke test\n\n- [ ] ship it\n\n> [!WARNING]\n> careful\n' |
            "$exe" convert - >"$RUNNER_TEMP/smoke.json"
          jq -e '.type == "doc" and .version == 1 and (.content | length) > 0' "$RUNNER_TEMP/smoke.json"
          "$exe" capabilities --json | jq -e '.schema_version == 1'
          # ADF_BUILD_COMMIT must have reached the binary (a full or abbreviated SHA).
          "$exe" version --json |
            jq -e --arg head "$(git rev-parse HEAD)" \
              '.commit as $c | ($c | type) == "string" and ($c | length) >= 7 and ($head | startswith($c))'

      - name: Package
        run: |
          # With a release tag, package.sh also refuses a tag/Cargo.toml version mismatch.
          scripts/package.sh "$TARGET" ${TAG:+"$TAG"}
          ls -l target/dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: target/dist/*.zip
          if-no-files-found: error
          # Release builds: 30 days, GitHub's window for re-running failed jobs, so a re-run of
          # publish still finds every archive. Dry runs: 7 days.
          retention-days: ${{ env.TAG != '' && 30 || 7 }}
          # Already zip-compressed.
          compression-level: 0

  publish:
    name: publish
    needs: [release-please, build]
    # Implicit success(): every build must have passed.
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-26.04
    # Owner-side: protect this environment (for example, allow only the main branch).
    environment: release
    permissions:
      contents: write # upload release assets and publish the draft release
      id-token: write # OIDC token for the Sigstore signature of the attestation
      attestations: write # store the build-provenance attestation
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: SHA256SUMS
        working-directory: dist
        run: |
          # Exactly one archive per build target, and nothing else: download-artifact does not
          # fail when an artifact is missing (for example, expired before a re-run), and an
          # incomplete release must never be published. Keep in sync with the build matrix.
          targets=(
            x86_64-unknown-linux-musl
            aarch64-unknown-linux-musl
            x86_64-apple-darwin
            aarch64-apple-darwin
            x86_64-pc-windows-msvc
            aarch64-pc-windows-msvc
          )
          expected=()
          for target in "${targets[@]}"; do
            expected+=("adf-converter-$TAG-$target.zip")
          done
          shopt -s nullglob
          archives=(*.zip)
          failed=0
          for name in "${expected[@]}"; do
            if [[ ! -f $name ]]; then
              echo "::error::missing release archive $name"
              failed=1
            fi
          done
          if [[ ${#archives[@]} -ne ${#expected[@]} ]]; then
            echo "::error::expected ${#expected[@]} release archives, found ${#archives[@]}: ${archives[*]}"
            failed=1
          fi
          [[ $failed -eq 0 ]] || exit 1
          sha256sum -- "${expected[@]}" >SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Upload the assets, then publish the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "$TAG" dist/*.zip dist/SHA256SUMS --clobber
          gh release edit "$TAG" --draft=false
