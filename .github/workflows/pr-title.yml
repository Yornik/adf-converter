# PRs are squash-merged and release-please reads the squash commits on main. This check keeps
# every PR title a Conventional Commit; make `conventional-title` a required status check.
#
# Until the repository's squash commit title is set to "Pull request title" (see
# docs/maintainers.md), GitHub uses the commit message instead of the PR title for a PR with a
# single (non-merge) commit. validateSingleCommit covers that case: the commit must be a
# Conventional Commit too, and must match the PR title.
#
# Runs on pull_request (not pull_request_target): the action only reads the PR title and its
# commits, so it never needs a write token or the base repository's secrets, and fork PRs are safe.
name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  conventional-title:
    name: conventional-title
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read # read the PR title and its commits
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          # The Conventional Commits types, plus `deps` (Dependabot's Rust updates; see
          # release-please-config.json for which types produce a release).
          types: |
            feat
            fix
            perf
            deps
            revert
            docs
            refactor
            test
            build
            ci
            style
            chore
          requireScope: false
          validateSingleCommit: true
          validateSingleCommitMatchesPrTitle: true
