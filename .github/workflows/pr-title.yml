# PRs are squash-merged with the PR title as the commit message, and release-please reads those
# commits. This check keeps every title a Conventional Commit; make `conventional-title` a
# required status check.
#
# Runs on pull_request (not pull_request_target): the action only reads the PR title, so it never
# needs a write token or the base repository's secrets, and fork PRs are safe.
name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  conventional-title:
    name: conventional-title
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read # read the PR title
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          # The Conventional Commits types, plus `deps` (Dependabot's Rust updates; see
          # release-please-config.json for which types produce a release).
          types: |
            feat
            fix
            perf
            deps
            revert
            docs
            refactor
            test
            build
            ci
            style
            chore
          requireScope: false
